<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');
      
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .header-bar { fill: #161b22; rx: 10px 10px 0 0; }
      .btn-close { fill: #ff5f56; }
      .btn-min { fill: #ffbd2e; }
      .btn-max { fill: #27c93f; }
      .header-title { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
      
      .ascii-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #3fb950;
        white-space: pre;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      .accent-blue { fill: #58a6ff; }
      .accent-purple { fill: #bc8cff; }
      .accent-gray { fill: #8b949e; }
      
      .cursor {
        fill: #3fb950;
        animation: blink 1s infinite;
      }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Line typing stagger animation */
      .line { opacity: 0; animation: fadeIn 0.4s forwards; }
      .l1 { animation-delay: 0.2s; }
      .l2 { animation-delay: 0.4s; }
      .l3 { animation-delay: 0.6s; }
      .l4 { animation-delay: 0.8s; }
      .l5 { animation-delay: 1.0s; }
      .l6 { animation-delay: 1.2s; }
      .l7 { animation-delay: 1.4s; }
      .l8 { animation-delay: 1.6s; }
      .l9 { animation-delay: 1.8s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-5px); }
        to { opacity: 1; transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="418" height="298" class="bg" />
  
  <!-- Header Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 409 1 A 10 10 0 0 1 419 11 L 419 32 L 1 32 Z" class="header-bar" />
  <circle cx="16" cy="16.5" r="5" class="btn-close" />
  <circle cx="32" cy="16.5" r="5" class="btn-min" />
  <circle cx="48" cy="16.5" r="5" class="btn-max" />
  <text x="210" y="20" text-anchor="middle" class="header-title">alwan@terminal ~ ascii-art.sh</text>
  <line x1="1" y1="32" x2="419" y2="32" stroke="#30363d" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(18, 48)">
    <text y="14" class="ascii-text line l1"><tspan class="accent-blue">alwan9@github</tspan>:<tspan class="accent-purple">~</tspan>$ ./whoami.sh</text>

    <!-- ASCII Art Banner -->
    <text y="40" class="ascii-text line l2">  █████╗ ██╗  ██╗██╗    ██╗█████╗ ███╗   ██╗</text>
    <text y="54" class="ascii-text line l3"> ██╔══██╗██║  ██║██║    ██║██╔══██╗████╗  ██║</text>
    <text y="68" class="ascii-text line l4"> ███████║██║  ██║██║ █╗ ██║███████║██╔██╗ ██║</text>
    <text y="82" class="ascii-text line l5"> ██╔══██║██║  ██║██║███╗██║██╔══██║██║╚██╗██║</text>
    <text y="96" class="ascii-text line l6"> ██║  ██║███████╗╚███╔███╔╝██║  ██║██║ ╚████║</text>
    <text y="110" class="ascii-text line l7"> ╚═╝  ╚═╝╚══════╝ ╚══╝╚══╝ ╚═╝  ╚═╝╚═╝  ╚═══╝</text>

    <text y="135" class="ascii-text line l8"><tspan class="accent-purple">┌──[</tspan><tspan class="accent-blue">HAFIZ ALWAN SUSILO</tspan><tspan class="accent-purple">]</tspan></text>
    <text y="152" class="ascii-text line l8"><tspan class="accent-purple">├──</tspan> <tspan class="accent-gray">Role:</tspan> Front-End &amp; Full-Stack Dev</text>
    <text y="169" class="ascii-text line l8"><tspan class="accent-purple">├──</tspan> <tspan class="accent-gray">Focus:</tspan> Web Apps, E-Commerce, Landing Pages</text>
    <text y="186" class="ascii-text line l8"><tspan class="accent-purple">└──</tspan> <tspan class="accent-gray">Status:</tspan> 🟢 Available for Hire &amp; Projects</text>

    <text y="215" class="ascii-text line l9"><tspan class="accent-blue">alwan9@github</tspan>:<tspan class="accent-purple">~</tspan>$ <rect x="145" y="204" width="8" height="13" class="cursor" /></text>
  </g>
</svg>
